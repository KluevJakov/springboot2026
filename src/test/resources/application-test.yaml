spring:
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  application:
    name: task-application
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  liquibase:
    enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host:
    port:
    username:
    password:
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

jwt:
  expiration: 1800000
  key: 0JTQtdGA0LXQstC90Y8sINCz0LTQtSDRgdC60YPRh9Cw0Lsg0JXQstCz0LXQvdC40LksCtCR0YvQu9CwINC/0YC80YfQuNCy0YvRhSDQtNGA0LjQsNC0Lgo

server:
  port: 8080
